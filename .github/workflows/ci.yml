name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: incident_tracker
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d incident_tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/incident_tracker
      DB_USERNAME: admin
      DB_PASSWORD: password123
      JWT_SECRET: ciOnlyThrowawaySecretForTestsNotRealPleaseIgnore0123456789abcdef
      PGHOST: localhost
      PGUSER: admin
      PGPASSWORD: password123
      PGDATABASE: incident_tracker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Apply schema
        run: psql -v ON_ERROR_STOP=1 -f db/001_init.sql -f db/002_add_sla_breached.sql -f db/003_sla_engine_role.sql
      - name: Test
        working-directory: api
        run: ./mvnw -B test
  infra:                         
    runs-on: ubuntu-latest          
    defaults:                         
      run:                            
        working-directory: infra      
    steps:                            
      - uses: actions/checkout@v6     
      - uses: hashicorp/setup-terraform@v4
        with:                         
          terraform_version: 1.15.8 
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build Lambda zip
        run: python ../lambdas/sla/build.py
      - name: Init
        run: terraform init -backend=false
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate
        run: terraform validate