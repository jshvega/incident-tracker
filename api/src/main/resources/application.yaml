spring:
  application:
    name: incident-tracker
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      max-lifetime: 540000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
server:
    port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    org.springframework.security: INFO
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 60
  
